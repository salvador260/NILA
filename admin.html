<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت NILA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 20%,rgba(11,143,114,.35),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(135deg,#07100d,#111,#050807);

    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px;
    padding:22px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(20px);
    border-radius:24px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
}

.header h1{
    margin:0;
}

.header button{
    border:none;
    border-radius:13px;
    padding:12px 18px;
    cursor:pointer;
    color:white;
    background:#0b8f72;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    padding:20px;
    border-radius:20px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);

    box-shadow:
        0 20px 45px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.1);
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.orders{
    display:grid;
    gap:20px;
}

.order{
    padding:24px;
    border-radius:24px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(20px);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);

    transition:.25s;
}

.order:hover{
    transform:translateY(-4px);
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.info{
    line-height:2;
    color:#dce8e4;
}

.product{
    margin:8px 0;
    padding:12px;
    border-radius:12px;
    background:rgba(0,0,0,.2);
}

.status{
    border:none;
    border-radius:12px;
    padding:9px 12px;
    color:white;
    background:#0b8f72;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:18px 0;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.actions button{
    border:none;
    border-radius:12px;
    padding:11px 15px;
    cursor:pointer;
    color:white;
}

.refresh{
    background:#2364c7;
}

.delete{
    background:#b93232;
}

.logout{
    background:#333;
}

.empty{
    text-align:center;
    padding:50px;
    border-radius:25px;
    background:rgba(255,255,255,.07);
}

@media(max-width:700px){

    body{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:stretch;
    }

    .top{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📦 پنل مدیریت NILA</h1>

        <div>
            <button onclick="loadOrders()">🔄 بروزرسانی</button>
            <button class="logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="stats">

        <div class="stat">
            کل سفارش‌ها
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            سفارش‌های جدید
            <strong id="newOrders">0</strong>
        </div>

        <div class="stat">
            مبلغ کل
            <strong id="totalAmount">0</strong>
        </div>

    </div>

    <div id="orders" class="orders">
        در حال دریافت سفارش‌ها...
    </div>

</div>


<script>

if(sessionStorage.getItem("adminLoggedIn") !== "true"){
    window.location.href = "admin-login.html";
}


let knownOrders = new Set(
    JSON.parse(
        localStorage.getItem("knownOrders") || "[]"
    )
);


async function loadOrders(){

    try{

        const response =
            await fetch("https://nila-h3jq.onrender.com/orders");

        if(!response.ok){
            throw new Error("Server error");
        }

        const orders = await response.json();

        const box =
            document.getElementById("orders");


        document.getElementById("totalOrders").textContent =
            orders.length.toLocaleString("fa-IR");


        const newCount =
            orders.filter(
                order => (order.status || "سفارش جدید") === "سفارش جدید"
            ).length;


        document.getElementById("newOrders").textContent =
            newCount.toLocaleString("fa-IR");


        const total =
            orders.reduce(
                (sum,order) => sum + Number(order.amount || 0),
                0
            );


        document.getElementById("totalAmount").textContent =
            total.toLocaleString("fa-IR") + " تومان";


        if(orders.length === 0){

            box.innerHTML =
                `<div class="empty">هنوز سفارشی ثبت نشده است.</div>`;

            return;
        }


        const currentIds = orders.map(order => order._id);


        const hasNewOrder =
            currentIds.some(id => !knownOrders.has(id));


        if(hasNewOrder && knownOrders.size > 0){

            showNotification();
        }


        knownOrders = new Set(currentIds);

        localStorage.setItem(
            "knownOrders",
            JSON.stringify(currentIds)
        );


        box.innerHTML = orders.map(order => `

            <div class="order">

                <div class="top">

                    <div>
                        <h2>🛒 سفارش #${order._id}</h2>

                        <div class="info">

                            👤 نام:
                            ${order.fullName || "وارد نشده"}

                            <br>

                            📞 تلفن:
                            ${order.phone || "وارد نشده"}

                            <br>

                            🏙 استان:
                            ${order.province || "وارد نشده"}

                            <br>

                            🏙 شهر:
                            ${order.city || "وارد نشده"}

                            <br>

                            📍 آدرس:
                            ${order.address || "وارد نشده"}

                            <br>

                            📮 کد پستی:
                            ${order.postalCode || "وارد نشده"}

                        </div>
                    </div>


                    <select
                        class="status"
                        onchange="changeStatus('${order._id}',this.value)"
                    >

                        ${[
                            "سفارش جدید",
                            "در حال آماده‌سازی",
                            "ارسال شد",
                            "تحویل داده شد",
                            "لغو شد"
                        ].map(status => `
                            <option
                                value="${status}"
                                ${status === (order.status || "سفارش جدید") ? "selected" : ""}
                            >
                                ${status}
                            </option>
                        `).join("")}

                    </select>

                </div>


                <h3>محصولات</h3>

                ${
                    (order.products || []).map(product => `

                        <div class="product">

                            ${product.name}

                            × ${product.quantity}

                            <br>

                            ${Number(product.price).toLocaleString("fa-IR")}
                            تومان

                        </div>

                    `).join("")
                }


                <div class="price">
                    💰
                    ${Number(order.amount || 0).toLocaleString("fa-IR")}
                    تومان
                </div>


                <div class="info">

                    🕒
                    ${formatDate(order.createdAt || order.date)}

                </div>


                <div class="actions">

                    <button
                        class="refresh"
                        onclick="changeStatus('${order._id}','در حال آماده‌سازی')"
                    >
                        آماده‌سازی
                    </button>

                    <button
                        class="refresh"
                        onclick="changeStatus('${order._id}','ارسال شد')"
                    >
                        ارسال شد
                    </button>

                    <button
                        class="delete"
                        onclick="deleteOrder('${order._id}')"
                    >
                        🗑 حذف
                    </button>

                </div>

            </div>

        `).join("");

    }catch(error){

        document.getElementById("orders").innerHTML =
            `<div class="empty">خطا در دریافت سفارش‌ها</div>`;

        console.error(error);
    }

}


async function changeStatus(id,status){
alert("changeStatus اجرا شد");
    const response =
        await fetch(
            "https://nila-h3jq.onrender.com/orders/" + id,
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    status:status
                })
            }
        );


    if(response.ok){
        loadOrders();
    }else{
        alert("تغییر وضعیت انجام نشد");
    }

}


async function deleteOrder(id){

    if(!confirm("این سفارش حذف شود؟")){
        return;
    }


    const response =
        await fetch(
            "https://nila-h3jq.onrender.com/orders/" + id,
            {
                method:"DELETE"
            }
        );


    if(response.ok){
        loadOrders();
    }else{
        alert("حذف سفارش انجام نشد");
    }

}


function formatDate(date){

    if(!date) return "نامشخص";

    return new Date(date).toLocaleString("fa-IR");
}


function showNotification(){

    if("Notification" in window){

        if(Notification.permission === "granted"){

            new Notification(
                "سفارش جدید NILA",
                {
                    body:"یک سفارش جدید ثبت شده است."
                }
            );

        }else if(Notification.permission !== "denied"){

            Notification.requestPermission();

        }

    }

    try{

        const audioContext =
            new (window.AudioContext || window.webkitAudioContext)();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = 800;

        gain.gain.value = 0.08;

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.2
        );

    }catch(error){
        console.log(error);
    }
}


function logout(){

    sessionStorage.removeItem("adminLoggedIn");

    window.location.href =
        "admin-login.html";
}


loadOrders();

setInterval(loadOrders,5000);

</script>

</body>
</html>
