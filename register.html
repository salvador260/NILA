<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت نام | NILA</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:

    linear-gradient(135deg,#020202,#0b2b19,#ffffff);

}


/* حباب های نور */

body::before,
body::after{

    content:"";

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    animation:float 8s infinite alternate;

}


body::before{

    width:350px;

    height:350px;

    background:#20ff70;

    top:-100px;

    right:-100px;

    opacity:.35;

}


body::after{

    width:300px;

    height:300px;

    background:#ffffff;

    bottom:-100px;

    left:-100px;

    opacity:.2;

}



@keyframes float{

from{

transform:translate(0,0);

}

to{

transform:translate(80px,60px);

}

}




.register-box{


position:relative;

width:400px;

padding:45px;


background:

linear-gradient(

145deg,

rgba(255,255,255,.35),

rgba(255,255,255,.08)

);



backdrop-filter:blur(30px);



border-radius:35px;



border:

1px solid rgba(255,255,255,.5);



box-shadow:


0 50px 100px rgba(0,0,0,.5),


inset 0 0 40px rgba(255,255,255,.25);



transform-style:preserve-3d;



animation:

card 1s ease;

}



.register-box:hover{


transform:

rotateY(-5deg)

rotateX(5deg);


}



@keyframes card{


from{

opacity:0;

transform:

translateY(80px)

scale(.7);

}

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}





h2{


color:white;

font-size:32px;

text-align:center;

margin-bottom:35px;


text-shadow:

0 0 20px #23d766;


}





input{


width:100%;


padding:17px;


margin-bottom:20px;


border:none;


outline:none;


border-radius:18px;



background:

rgba(255,255,255,.15);



color:white;


font-size:16px;



border:

1px solid rgba(255,255,255,.3);



transition:.4s;


}



input::placeholder{

color:#ddd;

}



input:focus{


background:

rgba(255,255,255,.3);



box-shadow:


0 0 30px #23d766;


transform:

translateZ(20px);

}





button{


width:100%;


padding:18px;



border:none;



border-radius:20px;



font-size:18px;



font-weight:bold;



color:white;



cursor:pointer;



background:


linear-gradient(

135deg,

#23d766,

#087c36

);



box-shadow:


0 0 30px #23d766;



transition:.4s;


}



button:hover{


transform:

translateY(-8px)

scale(1.05);



box-shadow:


0 0 60px #23d766;


}
</style>

</head>


<body>


<div class="register-box">


<h2>
ثبت نام در NILA
</h2>


<input id="name" placeholder="نام و نام خانوادگی">


<input id="phone" placeholder="شماره موبایل">


<input id="password" type="password" placeholder="رمز عبور">


<button onclick="registerUser()">

ثبت نام

</button>


</div>



<script>


function registerUser(){


let user={

name:
document.getElementById("name").value,


phone:
document.getElementById("phone").value,


password:
document.getElementById("password").value

};



localStorage.setItem(
"user",
JSON.stringify(user)
);



alert("ثبت نام موفق بود");


window.location.href="profile.html";


}


</script>


</body>

</html>
