<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود مدیر</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Tahoma,sans-serif;
    background:
        radial-gradient(circle at top right,#1ed8b0 0%,transparent 35%),
        radial-gradient(circle at bottom left,#111 0%,transparent 40%),
        #0b0f0e;
}

.login-box{
    width:min(420px,90%);
    padding:35px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:25px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.18);
    text-align:center;
}

h1{
    color:white;
    margin-bottom:10px;
}

.subtitle{
    color:#b9c7c3;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:14px;
    outline:none;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:16px;
    text-align:center;
}

input::placeholder{
    color:#cbd5d2;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#0b8f72;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#10b991;
}

#error{
    margin-top:15px;
    color:#ff6b6b;
    min-height:22px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>🔐 ورود مدیر</h1>

    <div class="subtitle">
        ورود به پنل مدیریت سفارش‌ها
    </div>

    <input
        type="password"
        id="password"
        placeholder="رمز عبور مدیر"
    >

    <button onclick="login()">
        ورود به پنل
    </button>

    <div id="error"></div>

</div>

<script>

function login(){

    const password =
        document.getElementById("password").value;

    if(password === "1388Artin###"){

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href = "admin.html";

    }else{

        document.getElementById("error").textContent =
            "رمز عبور اشتباه است";

    }

}

</script>

</body>
</html>
